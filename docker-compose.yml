services:
  libre:
    build: .
    image: libre-dashboard:latest
    container_name: libre-dashboard
    restart: unless-stopped
    init: true
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: .env
    environment:
      DB_PATH: /app/data/readings.db
      PORT: "8080"   # internal port; change HOST_PORT in .env to remap
    volumes:
      - ./data:/app/data
    ports:
      - "${HOST_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
